<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>FIGHTER SYSTEM</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#07090d;--card:#10141c;--card2:#151b25;--line:#27303d;--txt:#f5f7fb;--muted:#8f9aaa;--red:#ff3b30;--gold:#ffc857;--green:#42d392;--blue:#54a7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#171c29 0,#07090d 45%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1150px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:900;letter-spacing:2px}.brand small{display:block;color:var(--red);font-size:10px;letter-spacing:3px}.pill{border:1px solid var(--line);background:#0c1017;border-radius:999px;padding:8px 12px;color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;margin-bottom:15px}nav button{white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);padding:10px 13px;border-radius:12px}nav button.active{color:white;border-color:#586477;background:var(--card2)}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.card{background:linear-gradient(145deg,#111620,#0c1017);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0004}.hero h1{font-size:30px;margin:3px 0}.eyebrow{color:var(--red);font-weight:800;font-size:12px;letter-spacing:2px}.xp{height:10px;background:#252c36;border-radius:20px;overflow:hidden;margin:10px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff9a3c);width:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{font-size:26px;font-weight:900}.muted{color:var(--muted)}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}.mission{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.check{width:26px;height:26px;border-radius:8px;border:1px solid #475161;background:#0a0d12}.check.done{background:var(--green);border-color:var(--green);color:#04130b}.mission.done{opacity:.55}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#1a222e;color:#b7c2d0}.btn{border:1px solid var(--line);background:#171d27;color:white;padding:9px 12px;border-radius:11px}.btn.primary{background:var(--red);border-color:var(--red);font-weight:800}.btn.gold{background:#3a2b08;border-color:#705313;color:#ffd978}.btn.danger{background:#2b1111;border-color:#642323;color:#ff9a94}.bar{height:8px;background:#222a35;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid var(--line);text-align:right}.rank{font-size:42px;font-weight:1000;color:var(--gold)}.dangerbox{border-color:#6b2929;background:#211013}.success{color:var(--green)}.dangerText{color:#ff7770}.media{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media img,.media video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#080a0e}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal>div{max-width:600px;width:100%;max-height:90vh;overflow:auto}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#090d13;border:1px solid var(--line);color:white;border-radius:10px;padding:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171d27;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:10}.empty{padding:22px;text-align:center;color:var(--muted)}@media(max-width:800px){.hero,.grid2{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.media{grid-template-columns:repeat(2,1fr)}.mission{grid-template-columns:auto 1fr}.mission .reward{grid-column:2}.app{padding:12px}}
</style></head><body><div class="app"><div class="top"><div class="brand">FIGHTER SYSTEM<small>SOLO LEVELING FOR MMA</small></div><div class="pill" id="streak">🔥 0 DAY STREAK</div></div><nav id="nav"></nav><main id="view"></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div><script>
const KEY='fighter_system_v2';
const base={name:'Fighter',level:1,xp:0,rank:'E',streak:0,lastDate:null,started:false,notifications:false,goal:'become a complete MMA fighter',daysPerWeek:4,sessionMin:60,stats:{striking:5,wrestling:5,grappling:5,cardio:5,strength:5,speed:5,footwork:5,fightIQ:5,mobility:5,discipline:5},tests:{pushups:0,pullups:0,run:0,plank:0},missions:[],history:[],media:[],injuries:[],achievements:[],settings:{restDay:false},camp:null};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(base);let tab='home';
const today=()=>new Date().toISOString().slice(0,10);const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function toast(x){const e=document.getElementById('toast');e.textContent=x;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function xpNeed(){return 500+S.level*180}function addXP(n){S.xp+=n;while(S.xp>=xpNeed()){S.xp-=xpNeed();S.level++;S.rank=S.level>=30?'S':S.level>=20?'A':S.level>=12?'B':S.level>=6?'C':S.level>=3?'D':'E';toast('⬆️ LEVEL UP — LEVEL '+S.level)}save()}
const labels={striking:'Striking',wrestling:'Wrestling',grappling:'Grappling',cardio:'Cardio',strength:'Strength',speed:'Speed',footwork:'Footwork',fightIQ:'Fight IQ',mobility:'Mobility',discipline:'Discipline'};
function activeInjury(){return S.injuries.some(x=>!x.cleared)}
function missionPool(){let m=[
['Shadow Boxing','5 × 3 min • حركة + Guard + تنفس','striking',90],['Footwork Drill','15 دقيقة: دخول/خروج + زوايا','footwork',70],['Conditioning','8 جولات: 30ث عمل / 30ث راحة','cardio',80],['Strength Base','4 × 8 Squats + 4 × 6 Push-ups + 3 × 5 Pull-ups إن أمكن','strength',80],['Mobility','12 دقيقة للورك والكاحل والكتف','mobility',50],['Fight IQ','شاهد جولة احترافية وسجّل 3 ملاحظات تكتيكية','fightIQ',50],['Wrestling Solo','10 دقائق: stance + level change + sprawl تقني','wrestling',70],['Grappling Drill','10 دقائق حركة أرضية آمنة بدون ضغط على الرقبة','grappling',70],['Discipline Quest','رتّب أدواتك + حضّر ملابس التدريب + 10 دقائق بلا هاتف','discipline',40],['Recovery','مشي خفيف 20 دقيقة + تنفس + ترطيب','cardio',35]];
if(activeInjury())m=m.filter(x=>['mobility','fightIQ','discipline','recovery'].includes(x[2]));return m;
}
function generate(){if(S.missions.some(x=>x.date===today()))return;let p=missionPool(), n=Math.min(6,Math.max(4,S.daysPerWeek+1));let scored=p.map(x=>({x,score:Math.random()+((10-(S.stats[x[2]]||5))/20)})).sort((a,b)=>b.score-a.score).slice(0,n);S.missions=scored.map((z,i)=>({id:Date.now()+i,date:today(),title:z.x[0],desc:z.x[1],stat:z.x[2],xp:z.x[3]+Math.min(40,S.level*2),done:false}));save()}
function complete(id){let m=S.missions.find(x=>x.id===id);if(!m||m.done)return;m.done=true;addXP(m.xp);S.stats[m.stat]=Math.min(100,S.stats[m.stat]+(m.stat==='discipline'?0.4:0.25));if(!S.lastDate||S.lastDate!==today()){S.streak++;S.lastDate=today()}S.history.push({date:today(),type:'mission',name:m.title,xp:m.xp});checkAchievements();save();render();}
function checkAchievements(){const count=S.history.filter(x=>x.type==='mission').length;const ach=[['first','First Quest',count>=1],['10','10 Quests',count>=10],['50','50 Quests',count>=50],['level5','Level 5',S.level>=5],['streak7','7 Day Streak',S.streak>=7]];ach.forEach(a=>{if(a[2]&&!S.achievements.includes(a[0])){S.achievements.push(a[0]);addXP(150);toast('🏆 Achievement: '+a[1])}})}
function render(){document.getElementById('streak').textContent='🔥 '+S.streak+' DAY STREAK';document.getElementById('nav').innerHTML=['home:⚔️ System','training:🎯 Training','stats:📊 Stats','progress:📸 Progress','camp:🏕️ Fight Camp','profile:🧬 Profile'].map(x=>{let [a,b]=x.split(':');return `<button class="${tab===a?'active':''}" onclick="tab='${a}';render()">${b}</button>`}).join('');if(tab==='home')home();if(tab==='training')training();if(tab==='stats')stats();if(tab==='progress')progress();if(tab==='camp')camp();if(tab==='profile')profile()}
function home(){generate();let done=S.missions.filter(x=>x.done).length, pct=Math.round(S.xp/xpNeed()*100);document.getElementById('view').innerHTML=`<section class="hero"><div class="card"><div class="eyebrow">SYSTEM ONLINE</div><h1>${S.name} <span class="muted">/ LVL ${S.level}</span></h1><div class="row"><b>Rank ${S.rank}</b><span class="muted">${S.xp} / ${xpNeed()} XP</span></div><div class="xp"><i style="width:${pct}%"></i></div><div class="muted">${S.goal}</div></div><div class="card"><div class="rank">${S.rank}</div><div class="muted">FIGHTER RANK</div><button class="btn primary" onclick="startAssessment()">${S.started?'إعادة التقييم':'ابدأ التقييم'}</button></div></section><section class="section"><div class="row"><h2>⚔️ Daily Quests</h2><span class="tag">${done}/${S.missions.length} complete</span></div><div class="grid2">${S.missions.map(m=>`<div class="card mission ${m.done?'done':''}"><button class="check ${m.done?'done':''}" onclick="complete(${m.id})">${m.done?'✓':''}</button><div><b>${m.title}</b><div class="muted">${m.desc}</div><span class="tag">${labels[m.stat]} • +${m.xp} XP</span></div><div class="reward">${m.done?'DONE':'+'+m.xp}</div></div>`).join('')}</div></section><section class="section grid">${Object.entries(S.stats).slice(0,8).map(([k,v])=>`<div class="card"><div class="muted">${labels[k]}</div><div class="stat">${Math.round(v)}</div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</section>${activeInjury()?`<section class="section card dangerbox"><b class="dangerText">⚠️ RECOVERY MODE</b><div class="muted">في إصابة مسجلة. النظام خفّض المهام تلقائياً. إذا الألم شديد/متفاقم أو بعد ضربة، خذ تقييماً طبياً بدل الاعتماد على التطبيق.</div></section>`:''}`}
function training(){generate();document.getElementById('view').innerHTML=`<section class="card"><div class="row"><div><div class="eyebrow">ADAPTIVE ENGINE</div><h2>خطة اليوم</h2></div><button class="btn" onclick="regenerate()">↻ إعادة توليد</button></div><p class="muted">المهام تُوزّع حسب نقاط ضعفك، مستواك، وعدد أيام التدريب. لا يوجد تدريب قسري عند وجود إصابة.</p></section><section class="section grid2">${['striking','wrestling','grappling','cardio','strength','speed','footwork','fightIQ','mobility'].map(k=>`<div class="card"><div class="row"><b>${labels[k]}</b><span>${Math.round(S.stats[k])}</span></div><div class="bar"><i style="width:${S.stats[k]}%"></i></div></div>`).join('')}</section><section class="section card"><h2>🧾 تسجيل حصة</h2><div class="grid2"><div class="field"><label>نوع الحصة</label><select id="logType"><option>Boxing</option><option>Wrestling</option><option>BJJ/Grappling</option><option>Strength</option><option>Conditioning</option><option>Recovery</option></select></div><div class="field"><label>الدقائق</label><input id="logMin" type="number" value="60" min="1"></div></div><div class="field"><label>ملاحظات</label><textarea id="logNote" placeholder="شو تعلمت؟ شو كان صعب؟"></textarea></div><button class="btn primary" onclick="logSession()">حفظ الحصة + XP</button></section>`}
function regenerate(){S.missions=[];generate();render();toast('تم تحديث الـQuests')}function logSession(){let min=+document.getElementById('logMin').value||0,type=document.getElementById('logType').value,note=document.getElementById('logNote').value;let xp=Math.min(180,30+Math.round(min*1.4));addXP(xp);S.history.push({date:today(),type:'session',name:type,xp,min,note});if(type==='Boxing')S.stats.striking+=.5;if(type==='Wrestling')S.stats.wrestling+=.5;if(type.includes('Grappling'))S.stats.grappling+=.5;if(type==='Conditioning')S.stats.cardio+=.5;if(type==='Strength')S.stats.strength+=.5;save();render();toast('تم تسجيل الحصة +'+xp+' XP')}
function stats(){let rows=Object.entries(S.stats).map(([k,v])=>`<tr><td>${labels[k]}</td><td>${Math.round(v)}</td><td><div class="bar"><i style="width:${v}%"></i></div></td></tr>`).join('');document.getElementById('view').innerHTML=`<div class="card"><h2>📊 Fighter Analytics</h2><table class="table"><tr><th>Attribute</th><th>Score</th><th>Progress</th></tr>${rows}</table></div><div class="section grid2"><div class="card"><h2>📈 Training History</h2>${S.history.slice(-10).reverse().map(x=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${x.name}<small class="muted"> ${x.date}</small></span><b>+${x.xp}</b></div>`).join('')||'<div class="empty">لسا ما في سجل.</div>'}</div><div class="card"><h2>🏆 Achievements</h2>${S.achievements.map(x=>`<span class="tag">🏆 ${x}</span>`).join(' ')||'<div class="empty">ابدأ المهام لفتح الإنجازات.</div>'}</div></div>`}
function progress(){document.getElementById('view').innerHTML=`<section class="card"><div class="row"><div><h2>📸 Progress Vault</h2><div class="muted">الملفات تبقى محلياً على جهازك بهذا الإصدار.</div></div><button class="btn primary" onclick="document.getElementById('mediaInput').click()">+ إضافة صورة/فيديو</button></div><input id="mediaInput" class="hidden" type="file" accept="image/*,video/*" multiple onchange="addMedia(this.files)"></section><section class="section media">${S.media.map((m,i)=>m.type.startsWith('image')?`<div class="card"><img src="${m.url}"><small class="muted">${m.date}</small><button class="btn danger" onclick="delMedia(${i})">حذف</button></div>`:`<div class="card"><video src="${m.url}" controls></video><small class="muted">${m.date}</small><button class="btn danger" onclick="delMedia(${i})">حذف</button></div>`).join('')||'<div class="card empty">أضف أول صورة أو فيديو لتبدأ خط التطور.</div>'}</section>`}
function addMedia(files){[...files].forEach(f=>{if(f.size>25e6){toast('الملف أكبر من 25MB');return}let r=new FileReader();r.onload=()=>{S.media.push({type:f.type,url:r.result,date:today(),name:f.name});save();render()};r.readAsDataURL(f)});}
function delMedia(i){S.media.splice(i,1);save();render()}
function camp(){let c=S.camp;document.getElementById('view').innerHTML=`<section class="card"><div class="eyebrow">FIGHT CAMP</div><h2>معسكر النزال</h2><p class="muted">وضع منظم لفترة التحضير. لا يقرر التطبيق أنك جاهز للنزال؛ المدرب والطبيب يقرران ذلك.</p>${c?`<div class="grid2"><div><b>${c.weeks} أسابيع</b><div class="muted">الهدف: ${c.goal}</div></div><div><b>الأسبوع ${c.week||1}</b><div class="bar"><i style="width:${Math.min(100,(c.week||1)/c.weeks*100)}%"></i></div></div></div><button class="btn primary" onclick="advanceCamp()">إكمال أسبوع</button> <button class="btn danger" onclick="S.camp=null;save();render()">إنهاء المعسكر</button>`:`<div class="grid2"><div class="field"><label>عدد الأسابيع</label><input id="cw" type="number" min="2" max="12" value="8"></div><div class="field"><label>الهدف</label><select id="cg"><option>بناء أساس</option><option>رفع اللياقة</option><option>تحضير تقني</option><option>تحضير لنزال مع مدرب</option></select></div></div><button class="btn primary" onclick="startCamp()">بدء Fight Camp</button>`}</section>`}
function startCamp(){S.camp={weeks:+document.getElementById('cw').value||8,goal:document.getElementById('cg').value,week:1};save();render()}function advanceCamp(){if(S.camp.week<S.camp.weeks)S.camp.week++;addXP(250);save();render();toast('🏕️ أسبوع مكتمل +250 XP')}
function profile(){document.getElementById('view').innerHTML=`<section class="card"><h2>🧬 Fighter Profile</h2><div class="field"><label>اسم اللاعب</label><input id="pname" value="${S.name}"></div><div class="grid2"><div class="field"><label>أيام التدريب بالأسبوع</label><input id="days" type="number" min="1" max="7" value="${S.daysPerWeek}"></div><div class="field"><label>مدة الحصة بالدقائق</label><input id="mins" type="number" min="15" max="240" value="${S.sessionMin}"></div></div><div class="field"><label>هدفك</label><textarea id="goal">${S.goal}</textarea></div><button class="btn primary" onclick="saveProfile()">حفظ</button> <button class="btn" onclick="notify()">🔔 تفعيل إشعارات</button></section><section class="section card"><h2>🩹 Injury / Recovery</h2><div class="muted">سجّل مكان الألم حتى يخفّض النظام المهام. هذا ليس تشخيصاً طبياً.</div><div class="grid2"><div class="field"><label>المنطقة</label><input id="inj" placeholder="مثلاً: كتف، ركبة..."></div><div class="field"><label>الشدة 0–10</label><input id="pain" type="number" min="0" max="10" value="3"></div></div><button class="btn danger" onclick="addInjury()">تفعيل Recovery Mode</button><div class="section">${S.injuries.map((x,i)=>`<div class="row" style="padding:8px;border-bottom:1px solid var(--line)"><span>${x.area} • ألم ${x.pain}/10</span>${x.cleared?'<span class="success">Cleared</span>':`<button class="btn" onclick="clearInjury(${i})">Mark cleared</button>`}</div>`).join('')}</div></section><section class="section card"><h2>⚙️ Data</h2><button class="btn" onclick="exportData()">تصدير بياناتي</button> <button class="btn danger" onclick="resetAll()">مسح النظام</button></section>`}
function saveProfile(){S.name=document.getElementById('pname').value||'Fighter';S.daysPerWeek=+document.getElementById('days').value||4;S.sessionMin=+document.getElementById('mins').value||60;S.goal=document.getElementById('goal').value;save();render();toast('تم الحفظ')}
function addInjury(){let area=document.getElementById('inj').value.trim();let pain=+document.getElementById('pain').value;if(!area)return toast('اكتب المنطقة');S.injuries.push({area,pain,date:today(),cleared:false});S.missions=[];save();render();toast('Recovery Mode ON')}
function clearInjury(i){S.injuries[i].cleared=true;S.missions=[];save();render()}
function startAssessment(){showModal(`<h2>⚔️ Fighter Assessment</h2><p class="muted">دخل نتائجك الحالية فقط. لا تختبر نفسك لدرجة الإنهاك أو الألم.</p><div class="grid2">${[['pushups','Push-ups','عدد صحيح'],['pullups','Pull-ups','عدد صحيح'],['run','1.5km Run','الدقائق'],['plank','Plank','الثواني']].map(x=>`<div class="field"><label>${x[1]}</label><input id="a_${x[0]}" type="number" min="0" placeholder="${x[2]}"></div>`).join('')}</div><div class="field"><label>خبرتك القتالية</label><select id="a_exp"><option value="0">مبتدئ</option><option value="1">أتمرن أحياناً</option><option value="2">خبرة منتظمة</option><option value="3">متقدم/منافس</option></select></div><button class="btn primary" onclick="finishAssessment()">احسب مستواي</button>`)}
function finishAssessment(){let p=+document.getElementById('a_pushups').value||0,pu=+document.getElementById('a_pullups').value||0,r=+document.getElementById('a_run').value||0,pl=+document.getElementById('a_plank').value||0,e=+document.getElementById('a_exp').value;S.tests={pushups:p,pullups:pu,run:r,plank:pl};let score=Math.min(70,Math.round(p*.7+pu*2+Math.max(0,120-r*20)+pl*.08+e*8));let baseScore=Math.max(5,Math.min(45,Math.round(score/3)));Object.keys(S.stats).forEach(k=>S.stats[k]=baseScore+Math.floor(Math.random()*6));S.stats.strength=Math.min(100,baseScore+p/2+pu);S.stats.cardio=Math.min(100,baseScore+Math.max(0,70-r*5));S.stats.discipline=Math.max(S.stats.discipline,baseScore);S.started=true;S.missions=[];save();closeModal();render();toast('Assessment complete — Level '+S.level)}
function showModal(html){let m=document.getElementById('modal');m.innerHTML=`<div class="card">${html}<div style="margin-top:12px"><button class="btn" onclick="closeModal()">إغلاق</button></div></div>`;m.classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function notify(){if(!('Notification'in window)){toast('الإشعارات غير مدعومة بهذا المتصفح');return}let p=await Notification.requestPermission();S.notifications=p==='granted';save();if(p==='granted')new Notification('FIGHTER SYSTEM',{body:'Quest system online ⚔️'});toast(p==='granted'?'الإشعارات مفعّلة':'لم يتم السماح بالإشعارات')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='fighter-system-backup.json';a.click()}
function resetAll(){if(confirm('متأكد؟ سيتم حذف كل البيانات والصور المحلية.')){localStorage.removeItem(KEY);location.reload()}}
window.addEventListener('load',()=>{generate();render()});
</script></body></html>
