name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    - name: Prepare Web Assets & Build APK
      run: |
        # 1. تنظيف البيئة تماماً
        rm -rf node_modules android www package.json package-lock.json capacitor.config.json

        # 2. عزل ملفات الموقع داخل مجلد خاص (تجنباً للحلقة التكرارية)
        mkdir -p www
        cp -r index.html manifest.json sw.js *.png *.jpg *.jpeg *.js *.css www/ 2>/dev/null || true

        # 3. تثبيت Capacitor
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

        # 4. كتابة ملف الإعدادات
        cat <<EOT > capacitor.config.json
        {
          "appId": "com.crocjaw.mma",
          "appName": "MMA SYSTEM",
          "webDir": "www",
          "bundledWebRuntime": false
        }
        EOT

        # 5. إضافة الأندرويد ومزامنة الملفات
        npx cap add android
        npx cap sync

        # 6. تجميع ملف APK
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MMA-SYSTEM-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
