name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    - name: Accept All Licenses Explicitly
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clean & Build APK
      run: |
        rm -f package.json package-lock.json capacitor.config.json
        rm -rf node_modules android
        npm init -y
        npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        cat <<EOT > capacitor.config.json
        {
          "appId": "com.crocjaw.mma",
          "appName": "MMA SYSTEM",
          "webDir": ".",
          "bundledWebRuntime": false
        }
        EOT
        npx cap add android
        npx cap sync
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MMA-SYSTEM-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
